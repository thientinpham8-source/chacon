          ctx.stroke();
        } else {
          const sy = Math.max(0.22, Math.abs(Math.cos(p.flip || 0)));
          ctx.scale(1, sy);
          HiDPICanvas.roundRect(ctx, -p.size * 0.65, -p.size * 0.4, p.size * 1.3, p.size * 0.8, 3);
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();
      }

      /* Chữ điểm thưởng nổi hoạt hình */
      for (let i = this.floaters.length - 1; i >= 0; i--) {
        const f = this.floaters[i];
        f.life -= dt * 0.85;
        if (f.life <= 0) {
          this.floaters.splice(i, 1);
          continue;
        }
        f.y += f.vy * dt;
        f.vy *= 0.96;
        const scale = f.life > 0.8 ? 0.7 + ((1 - f.life) / 0.2) * 0.42 : 1.05;
        ctx.save();
        ctx.globalAlpha = Math.min(1, f.life * 1.6);
        ctx.translate(f.x, f.y);
        ctx.scale(scale, scale);
        ctx.font = '900 18px Nunito, ui-rounded, system-ui, sans-serif';
        const tw = ctx.measureText(f.text).width + 24;
        HiDPICanvas.roundRect(ctx, -tw / 2, -16, tw, 32, 16);
        ctx.fillStyle = f.bg;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#3B261D';
        ctx.stroke();
        ctx.fillStyle = '#3B261D';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.text, 0, 1);
        ctx.restore();
      }
    }
  }

  const VFX = new VFXCanvasEngine();

  /* ------------------------------------------------------------------------
     4. GroundCanvas — Vẽ sàn sân chơi 3D, bóng đổ động & vòng bụi va chạm
     ------------------------------------------------------------------------ */
  class GroundCanvas {
    constructor(canvas, opts = {}) {
      this.hi = new HiDPICanvas(canvas);
      this.scale = opts.scale || 42;
      this.tilt = opts.tilt || 0.34; // rad nghiêng camera
      this.theme = opts.theme || 'toybox';
      this.ripples = [];
      this.puffs = [];
      this._cloudPhase = 0;
    }

    projectGround(wx, wz) {
      const cx = this.hi.width * 0.5;
      const cy = this.hi.height * 0.68;
      const px = wx * this.scale;
      const pz = wz * this.scale;
      const persp = 680 / Math.max(220, 680 - pz * Math.cos(this.tilt));
      return {
        x: cx + px * persp,
        y: cy + pz * Math.sin(this.tilt) * persp,
        persp,
      };
    }

    spawnImpact(wx, wz, strength = 1, color = '#FFCA42') {
      const p = this.projectGround(wx, wz);
      const s = Math.min(1.6, Math.max(0.4, strength));
      this.ripples.push({ x: p.x, y: p.y, r: 8, maxR: 28 + s * 18, life: 1, color });
      for (let i = 0; i < 5; i++) {
        const a = (Math.PI * 2 * i) / 5 + Math.random() * 0.5;
        this.puffs.push({
          x: p.x + Math.cos(a) * 8,
          y: p.y + Math.sin(a) * 3,
          vx: Math.cos(a) * (24 + s * 22),
          vy: -12 - Math.random() * 18,
          r: 4 + Math.random() * 4,
          life: 1,
        });
      }
    }

    render(items, dt) {
      const { ctx, width: w, height: h } = this.hi;
      this.hi.clear();
      this._cloudPhase += dt * 10;

      /* Bầu trời pastel + mây trôi Kawaii */
      const horizonY = h * 0.46;
      const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      skyGrad.addColorStop(0, this.theme === 'dice' ? '#D9F2FF' : '#E3F6FF');
      skyGrad.addColorStop(1, '#FFF9EC');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, horizonY + 8);

      const c1x = ((this._cloudPhase * 0.9) % (w + 110)) - 55;
      const c2x = ((this._cloudPhase * 0.55 + w * 0.55) % (w + 110)) - 55;
      HiDPICanvas.drawCloud(ctx, c1x, h * 0.2, 0.72, 'rgba(255,255,255,0.88)');
      HiDPICanvas.drawCloud(ctx, c2x, h * 0.3, 0.56, 'rgba(255,255,255,0.78)');

      /* Mặt sàn 3D ô ly ấm áp */
      const floorGrad = ctx.createLinearGradient(0, horizonY, 0, h);
      if (this.theme === 'dice') {
        floorGrad.addColorStop(0, '#E9FBF2');
        floorGrad.addColorStop(1, '#C5F2DC');
      } else {
        floorGrad.addColorStop(0, '#FFF5DC');
        floorGrad.addColorStop(1, '#FFE4B5');
      }
      ctx.fillStyle = floorGrad;
      ctx.fillRect(0, horizonY, w, h - horizonY);

      /* Đường chân trời cong mềm */
      ctx.strokeStyle = 'rgba(59, 38, 29, 0.18)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, horizonY);
      ctx.lineTo(w, horizonY);
      ctx.stroke();

      /* Lưới phối cảnh sàn 3D */
      ctx.save();
      ctx.strokeStyle = this.theme === 'dice' ? 'rgba(30, 158, 102, 0.16)' : 'rgba(214, 144, 18, 0.16)';
      ctx.lineWidth = 1.5;
      for (let gx = -5; gx <= 5; gx++) {
        const pTop = this.projectGround(gx * 0.9, -2.5);
        const pBot = this.projectGround(gx * 0.9, 2.5);
        ctx.beginPath();
        ctx.moveTo(pTop.x, Math.max(horizonY, pTop.y));
        ctx.lineTo(pBot.x, pBot.y);
        ctx.stroke();
      }
      for (let gz = -2; gz <= 2; gz++) {
        const yRow = this.projectGround(0, gz * 0.95).y;
        if (yRow > horizonY) {
          ctx.beginPath();
          ctx.moveTo(12, yRow);
          ctx.lineTo(w - 12, yRow);
          ctx.stroke();
        }
      }
      ctx.restore();

      /* Bóng đổ động dưới chân từng khối vật lý Cannon */
      for (const it of items) {
        const pos = it.body.position;
        const g = this.projectGround(pos.x, pos.z);
        const heightAbove = Math.max(0, pos.y - it.half);
        const shrink = 1 / (1 + heightAbove * 0.24);
        const alpha = Math.max(0.08, 0.34 * shrink);
        const rx = it.pixelSize * 0.56 * g.persp * (0.75 + 0.35 * shrink);
        const ry = rx * 0.36;

        ctx.save();
        ctx.fillStyle = `rgba(59, 38, 29, ${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.ellipse(g.x, g.y + 4, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      /* Vòng sóng va chạm trên mặt sàn */
      for (let i = this.ripples.length - 1; i >= 0; i--) {
        const r = this.ripples[i];
        r.life -= dt * 2.5;
        if (r.life <= 0) {
          this.ripples.splice(i, 1);
          continue;
        }
        r.r += (r.maxR - r.r) * Math.min(1, dt * 10);
        ctx.save();
        ctx.globalAlpha = r.life * 0.75;
        ctx.strokeStyle = r.color;
        ctx.lineWidth = 2.6 * r.life;
        ctx.beginPath();
        ctx.ellipse(r.x, r.y + 4, r.r, r.r * 0.38, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      /* Bụi bông Kawaii khi khối nảy xuống sàn */
      for (let i = this.puffs.length - 1; i >= 0; i--) {
        const pf = this.puffs[i];
        pf.life -= dt * 2.3;
        if (pf.life <= 0) {
          this.puffs.splice(i, 1);
          continue;
        }
        pf.x += pf.vx * dt;
        pf.y += pf.vy * dt;
        ctx.save();
        ctx.globalAlpha = pf.life * 0.9;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(pf.x, pf.y, pf.r * pf.life + 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    destroy() {
      this.hi.destroy();
    }
  }

  /* ------------------------------------------------------------------------
     5. CSS3DRenderer — Đồng bộ thân vật lý Cannon sang khối lập phương CSS3D
     ------------------------------------------------------------------------ */
  const FACE_SPECS = [
    { key: 'front',  nx: 0,  ny: 0,  nz: 1,  rot: '' },
    { key: 'back',   nx: 0,  ny: 0,  nz: -1, rot: 'rotateY(180deg)' },
    { key: 'right',  nx: 1,  ny: 0,  nz: 0,  rot: 'rotateY(90deg)' },
    { key: 'left',   nx: -1, ny: 0,  nz: 0,  rot: 'rotateY(-90deg)' },
    { key: 'top',    nx: 0,  ny: 1,  nz: 0,  rot: 'rotateX(90deg)' },
    { key: 'bottom', nx: 0,  ny: -1, nz: 0,  rot: 'rotateX(-90deg)' },
  ];

  class CSS3DRenderer {
    constructor(sceneEl, opts = {}) {
      this.sceneEl = sceneEl;
      this.scale = opts.scale || 42;
      this.tiltDeg = opts.tiltDeg || -19;
      this.worldEl = document.createElement('div');
      this.worldEl.className = 'css3d-world';
      this.worldEl.style.transform = `rotateX(${this.tiltDeg}deg)`;
      this.sceneEl.innerHTML = '';
      this.sceneEl.appendChild(this.worldEl);
    }

    createCubeElement({ pixelSize, faces, bgColor, isDice, onTap }) {
      const cube = document.createElement('div');
      cube.className = 'css3d-cube';
      if (isDice) cube.dataset.die = bgColor === '#151515' ? 'black' : 'white';
      cube.style.setProperty('--cube-size', `${pixelSize}px`);
      const half = pixelSize / 2;
      const faceEls = {};

      FACE_SPECS.forEach((spec, idx) => {
        const f = document.createElement('div');
        f.className = isDice ? 'css3d-face dice-face' : 'css3d-face';
        f.style.transform = `${spec.rot} translateZ(${half}px)`.trim();
        const label = faces[idx] != null ? faces[idx] : faces[0];
        f.textContent = String(label);
        if (!isDice) {
          f.style.background = Array.isArray(bgColor) ? bgColor[idx % bgColor.length] : bgColor;
        } else {
          const dark = bgColor === '#151515';
          f.style.background = dark ? '#151515' : '#FFFFFF';
          f.style.color = dark ? '#FFFFFF' : '#151515';
          f.style.borderColor = dark ? '#666666' : '#151515';
          f.style.boxShadow = dark ? 'inset 0 3px 0 rgba(255,255,255,0.12), inset 0 -3px 0 rgba(0,0,0,0.4)' : 'inset 0 3px 0 rgba(255,255,255,0.8), inset 0 -3px 0 rgba(0,0,0,0.12)';
        }
        cube.appendChild(f);
        faceEls[spec.key] = f;
      });

      if (onTap) {
        cube.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          onTap(e);
        });
      }

      this.worldEl.appendChild(cube);
      return { el: cube, faceEls };
    }

    /* Chuyển đổi Quaternion Cannon (Y-up) sang CSS3D matrix3d (Y-down) chính xác */
    syncBody(item) {
      const p = item.body.position;
      const q = item.body.quaternion;
      const x = q.x, y = q.y, z = q.z, w = q.w;
      const x2 = x + x, y2 = y + y, z2 = z + z;
      const xx = x * x2, xy = x * y2, xz = x * z2;
      const yy = y * y2, yz = y * z2, zz = z * z2;
      const wx = w * x2, wy = w * y2, wz = w * z2;

      const r00 = 1 - (yy + zz);
      const r01 = xy - wz;
      const r02 = xz + wy;
      const r10 = xy + wz;
      const r11 = 1 - (xx + zz);
      const r12 = yz - wx;
      const r20 = xz - wy;
      const r21 = yz + wx;
      const r22 = 1 - (xx + yy);

      const tx = p.x * this.scale;
      const ty = -p.y * this.scale;
      const tz = p.z * this.scale;

      item.el.style.transform = `matrix3d(${
        r00.toFixed(5)},${(-r10).toFixed(5)},${r20.toFixed(5)},0,${
        (-r01).toFixed(5)},${r11.toFixed(5)},${(-r21).toFixed(5)},0,${
        r02.toFixed(5)},${(-r12).toFixed(5)},${r22.toFixed(5)},0,${
        tx.toFixed(2)},${ty.toFixed(2)},${tz.toFixed(2)},1)`;
    }

    removeElement(item) {
      if (item && item.el && item.el.parentNode) {
        item.el.parentNode.removeChild(item.el);
      }
    }

    destroy() {
      this.sceneEl.innerHTML = '';
    }
  }

  /* ------------------------------------------------------------------------
     6. DiaryPhysicsWorld — Thế giới vật lý Cannon.js hoàn chỉnh
     ------------------------------------------------------------------------ */
  class DiaryPhysicsWorld {
    constructor({ groundCanvas, sceneEl, mode = 'toybox', onBlockTap }) {
      this.mode = mode;
      this.scale = mode === 'dice' ? 46 : 40;
      this.onBlockTap = onBlockTap || null;
      this.items = [];
      this.destroyed = false;
      this._raf = null;
      this._last = performance.now();
      this._settleCallback = null;
      this._settleTimer = 0;
      this._rollElapsed = 0;

      /* Khởi tạo thế giới vật lý CANNON.World */
      this.world = new CANNON.World();
      this.world.gravity.set(0, mode === 'dice' ? -24 : -19, 0);
      if (CANNON.SAPBroadphase) {
        this.world.broadphase = new CANNON.SAPBroadphase(this.world);
      }
      this.world.allowSleep = true;

      this.groundMat = new CANNON.Material('ground');
      this.blockMat = new CANNON.Material('block');
      this.world.addContactMaterial(
        new CANNON.ContactMaterial(this.groundMat, this.blockMat, {
          friction: mode === 'dice' ? 0.42 : 0.36,
          restitution: mode === 'dice' ? 0.48 : 0.56,
        })
      );
      this.world.addContactMaterial(
        new CANNON.ContactMaterial(this.blockMat, this.blockMat, {
          friction: 0.3,
          restitution: 0.52,
        })
      );

      /* Mặt sàn & 4 bức tường vô hình giữ khối 3D luôn ở trong sân */
      this.groundBody = new CANNON.Body({ mass: 0, material: this.groundMat });
      this.groundBody.addShape(new CANNON.Plane());
      this.groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
      this.world.addBody(this.groundBody);

      const wallX = mode === 'dice' ? 3.1 : 3.2;
      const wallZ = mode === 'dice' ? 1.65 : 1.45;
      this._addWall(-wallX, 0, 0, 0, Math.PI / 2, 0);
      this._addWall(wallX, 0, 0, 0, -Math.PI / 2, 0);
      this._addWall(0, 0, -wallZ, 0, 0, 0);
      this._addWall(0, 0, wallZ, 0, Math.PI, 0);

      /* Bộ dựng Ground Canvas + CSS3D */
      this.ground = new GroundCanvas(groundCanvas, {
        scale: this.scale,
        tilt: mode === 'dice' ? 0.42 : 0.34,
        theme: mode,
      });
      this.css3d = new CSS3DRenderer(sceneEl, {
        scale: this.scale,
        tiltDeg: mode === 'dice' ? -25 : -19,
      });

      if (mode === 'toybox') {
        this._populateToybox();
      } else if (mode === 'dice') {
        this._populateDice('all');
      }

      this._startLoop();
    }

    _addWall(x, y, z, rx, ry, rz) {
      const w = new CANNON.Body({ mass: 0, material: this.groundMat });
      w.addShape(new CANNON.Plane());
      w.position.set(x, y, z);
      w.quaternion.setFromEuler(rx, ry, rz);
      this.world.addBody(w);
    }

    addCube({ x = 0, y = 2.4, z = 0, half = 0.48, faces, bgColor, isDice = false }) {
      const body = new CANNON.Body({
        mass: isDice ? 1.4 : 1.0,
        material: this.blockMat,
        linearDamping: 0.08,
        angularDamping: 0.12,
      });
      body.addShape(new CANNON.Box(new CANNON.Vec3(half, half, half)));
      body.position.set(x, y, z);
      body.quaternion.setFromEuler(
        Math.random() * 0.8,
        Math.random() * 1.4,
        Math.random() * 0.8
      );
      this.world.addBody(body);

      const pixelSize = Math.round(half * 2 * this.scale);
      const item = {
        body,
        half,
        pixelSize,
        faces: faces.slice(),
        color: Array.isArray(bgColor) ? bgColor[0] : (bgColor || '#FFCA42'),
        isDice,
        el: null,
        faceEls: null,
        lastImpactAt: 0,
      };

      const built = this.css3d.createCubeElement({
        pixelSize,
        faces: item.faces,
        bgColor: bgColor || '#FFCA42',
        isDice,
        onTap: (ev) => this.hopItem(item, ev),
      });
      item.el = built.el;
      item.faceEls = built.faceEls;

      /* Lắng nghe sự kiện va chạm từ Cannon để tạo bụi sàn & âm thanh */
      body.addEventListener('collide', (ev) => {
        const now = performance.now();
        if (now - item.lastImpactAt < 90) return;
        const impact = ev.contact && ev.contact.getImpactVelocityAlongNormal
          ? Math.abs(ev.contact.getImpactVelocityAlongNormal())
          : 0;
        if (impact > 1.8) {
          item.lastImpactAt = now;
          if (ev.body === this.groundBody) {
            this.ground.spawnImpact(body.position.x, body.position.z, impact / 6, item.color);
          }
          if (impact > 2.6) {
            KawaiiSFX.playBounce(impact);
          }
        }
      });

      this.items.push(item);
      return item;
    }

    hopItem(item, ev) {
      if (!item || !item.body) return;
      item.body.wakeUp();
      item.body.velocity.set(
        (Math.random() - 0.5) * 4.2,
        6.8 + Math.random() * 2.2,
        (Math.random() - 0.5) * 2.4
      );
      item.body.angularVelocity.set(
        (Math.random() - 0.5) * 9,
        (Math.random() - 0.5) * 9,
        (Math.random() - 0.5) * 9
      );
      KawaiiSFX.playPop();
      if (ev && typeof ev.clientX === 'number') {
        VFX.burstStars(ev.clientX, ev.clientY, 8);
      }
      if (this.onBlockTap) this.onBlockTap(item);
    }

    shakeAll() {
      KawaiiSFX.playSelect();
      this.items.forEach((it, idx) => {
        it.body.wakeUp();
        it.body.velocity.set(
          (Math.random() - 0.5) * 6,
          6.2 + (idx % 3) * 1.3 + Math.random() * 1.5,
          (Math.random() - 0.5) * 3.2
        );
        it.body.angularVelocity.set(
          (Math.random() - 0.5) * 11,
          (Math.random() - 0.5) * 11,
          (Math.random() - 0.5) * 11
        );
      });
    }

    spawnCelebrationBlock(symbol = '🌟') {
      const colors = ['#FFCA42', '#FF7B9C', '#52E0A0', '#63C7FF', '#B997FC', '#FF9F59'];
      /* Giữ tối đa 8 khối để khung hình luôn mượt 60fps */
      if (this.items.length >= 8) {
        const oldest = this.items.shift();
        this.world.removeBody(oldest.body);
        this.css3d.removeElement(oldest);
      }
      const c = colors[Math.floor(Math.random() * colors.length)];
      const item = this.addCube({
        x: (Math.random() - 0.5) * 2.8,
        y: 3.1,
        z: (Math.random() - 0.5) * 1.1,
        half: 0.46,
        faces: [symbol, '⭐', '💖', symbol, '✨', '🎁'],
        bgColor: c,
      });
      item.body.angularVelocity.set(4, 6, -3);
      return item;
    }

    _populateToybox() {
      const starters = [
        { x: -1.8, y: 2.3, z: 0.1,  faces: ['💖', '🤗', '👨', '👧', '💖', '🌸'], bg: '#FF8FAB' },
        { x: -0.9, y: 2.9, z: -0.2, faces: ['⭐', '🌟', '✨', '⭐', '🏆', '💫'], bg: '#FFCA42' },
        { x: 0.0,  y: 2.5, z: 0.25, faces: ['😊', '👋', '🥰', '😸', '🌈', '🎵'], bg: '#63C7FF' },
        { x: 0.95, y: 3.2, z: -0.1, faces: ['🎁', '🧸', '🍦', '📚', '🎁', '🎨'], bg: '#52E0A0' },
        { x: 1.85, y: 2.6, z: 0.15, faces: ['9×', 'A+', '10', '🎯', '🚀', '💡'], bg: '#B997FC' },
      ];
      starters.forEach((s) =>
        this.addCube({ x: s.x, y: s.y, z: s.z, half: 0.46, faces: s.faces, bgColor: s.bg })
      );
    }

    _diceFaceSets(rangeMode) {
      if (rangeMode === 'easy') {
        return [
          [2, 3, 4, 5, 3, 4],
          [2, 4, 5, 6, 7, 8],
        ];
      }
      if (rangeMode === 'hard') {
        return [
          [6, 7, 8, 9, 7, 8],
          [4, 5, 6, 7, 8, 9],
        ];
      }
      return [
        [2, 3, 4, 6, 7, 8],
        [3, 4, 5, 6, 8, 9],
      ];
    }

    _populateDice(rangeMode) {
      const [f1, f2] = this._diceFaceSets(rangeMode);
      this.dieA = this.addCube({
        x: -1.1,
        y: 1.8,
        z: 0,
        half: 0.58,
        faces: f1,
        bgColor: '#FFFFFF',
        isDice: true,
      });
      this.dieB = this.addCube({
        x: 1.1,
        y: 2.1,
        z: 0.1,
        half: 0.58,
        faces: f2,
        bgColor: '#151515',
        isDice: true,
      });
    }

    updateDiceFaces(item, newFaces) {
      item.faces = newFaces.slice();
      FACE_SPECS.forEach((spec, idx) => {
        const el = item.faceEls[spec.key];
        if (el) {
          el.textContent = String(newFaces[idx]);
          const dark = item.color === '#151515';
          el.style.background = dark ? '#151515' : '#FFFFFF';
          el.style.color = dark ? '#FFFFFF' : '#151515';
          el.style.outline = '';
          el.style.boxShadow = dark ? 'inset 0 3px 0 rgba(255,255,255,0.12), inset 0 -3px 0 rgba(0,0,0,0.4)' : 'inset 0 3px 0 rgba(255,255,255,0.8), inset 0 -3px 0 rgba(0,0,0,0.12)';
        }
      });
    }

    readTopFace(item) {
      let bestIdx = 4;
      let bestY = -Infinity;
      const tmp = new CANNON.Vec3();
      FACE_SPECS.forEach((spec, idx) => {
        tmp.set(spec.nx, spec.ny, spec.nz);
        const worldN = item.body.quaternion.vmult(tmp);
        if (worldN.y > bestY) {
          bestY = worldN.y;
          bestIdx = idx;
        }
      });
      return { value: Number(item.faces[bestIdx]), key: FACE_SPECS[bestIdx].key };
    }

    rollDice(rangeMode = 'all', onSettled) {
      if (!this.dieA || !this.dieB) return;
      /* Xáo ngẫu nhiên các số thuộc dải bảng cửu chương lên 6 mặt xúc xắc */
      const pickPool = (pool) => {
        const out = [];
        for (let i = 0; i < 6; i++) {
          out.push(pool[Math.floor(Math.random() * pool.length)]);
        }
        return out;
      };
      const poolA =
        rangeMode === 'easy' ? [2, 3, 4, 5] :
        rangeMode === 'hard' ? [6, 7, 8, 9] :
        [2, 3, 4, 5, 6, 7, 8, 9];
      const poolB = [2, 3, 4, 5, 6, 7, 8, 9];

      delete this.dieA.el.dataset.topValue; delete this.dieA.el.dataset.topFace;
      delete this.dieB.el.dataset.topValue; delete this.dieB.el.dataset.topFace;
      this.updateDiceFaces(this.dieA, pickPool(poolA));
      this.updateDiceFaces(this.dieB, pickPool(poolB));

      const launch = (die, baseX) => {
        die.body.wakeUp();
        die.body.position.set(baseX, 2.5 + Math.random() * 0.5, (Math.random() - 0.5) * 0.5);
        die.body.velocity.set(
          -baseX * (1.2 + Math.random() * 0.8),
          5.6 + Math.random() * 1.8,
          (Math.random() - 0.5) * 2.5
        );
        die.body.angularVelocity.set(
          (Math.random() > 0.5 ? 1 : -1) * (9 + Math.random() * 6),
          (Math.random() - 0.5) * 12,
          (Math.random() > 0.5 ? 1 : -1) * (8 + Math.random() * 6)
        );
      };

      launch(this.dieA, -1.55);
      launch(this.dieB, 1.55);
      KawaiiSFX.playSelect();

      this._settleCallback = onSettled || null;
      this._settleTimer = 0;
      this._rollElapsed = 0;
    }

    _checkDiceSettled(dt) {
      if (!this._settleCallback || !this.dieA || !this.dieB) return;
      this._rollElapsed += dt;
      const speedA = this.dieA.body.velocity.length() + this.dieA.body.angularVelocity.length();
      const speedB = this.dieB.body.velocity.length() + this.dieB.body.angularVelocity.length();
      if (this._rollElapsed > 0.45 && speedA < 0.55 && speedB < 0.55) {
        this._settleTimer += dt;
      } else {
        this._settleTimer = 0;
      }
      if (this._settleTimer >= 0.18 || this._rollElapsed >= 2.2) {
        /* Chốt viên xúc xắc đúng mặt ngửa để kết quả không đổi sau khi thông báo. */
        const settleDie = (die) => {
          const before = this.readTopFace(die);
          const spec = FACE_SPECS.find(f => f.key === before.key);
          const normal = die.body.quaternion.vmult(new CANNON.Vec3(spec.nx, spec.ny, spec.nz));
          const adjust = new CANNON.Quaternion();
          adjust.setFromVectors(normal, new CANNON.Vec3(0, 1, 0));
          const final = adjust.mult(die.body.quaternion);
          die.body.quaternion.copy(final);
          die.body.position.y = die.half + 0.015;
          die.body.velocity.setZero();
          die.body.angularVelocity.setZero();
          die.body.force.setZero();
          die.body.torque.setZero();
          die.body.sleep();
          this.css3d.syncBody(die);
          const result = this.readTopFace(die);
          die.el.dataset.topValue = String(result.value);
          die.el.dataset.topFace = result.key;
          if (die.faceEls[result.key]) {
            die.faceEls[result.key].style.outline = '3px solid #FFCA42';
            die.faceEls[result.key].style.outlineOffset = '-5px';
          }
          return result;
        };
        const rA = settleDie(this.dieA);
        const rB = settleDie(this.dieB);
        const cb = this._settleCallback;
        this._settleCallback = null;
        cb(rA.value, rB.value);
      }
    }

    _startLoop() {
      const tick = (now) => {
        if (this.destroyed) return;
        const dt = Math.min(0.04, Math.max(0.001, (now - this._last) / 1000));
        this._last = now;

        this.world.step(1 / 60, dt, 3);
        for (const it of this.items) {
          this.css3d.syncBody(it);
        }
        this.ground.render(this.items, dt);
        if (this.mode === 'dice') {
          this._checkDiceSettled(dt);
        }
        this._raf = requestAnimationFrame(tick);
      };
      this._raf = requestAnimationFrame(tick);
    }

    destroy() {
      this.destroyed = true;
      if (this._raf) cancelAnimationFrame(this._raf);
      this.ground.destroy();
      this.css3d.destroy();
    }
  }

  /* ------------------------------------------------------------------------
     7. LuckyWheelEngine — Vòng Quay Phần Thưởng Vật Lý trên HiDPI Canvas
     ------------------------------------------------------------------------ */
  class LuckyWheelEngine {
    constructor(canvas, rewards = []) {
      this.hi = new HiDPICanvas(canvas, () => { if (this.hi) this.draw(); });
      this.rewards = rewards.length ? rewards : [{ id: 'r1', label: 'Quà bí mật', icon: '🎁', color: '#FFCA42', weight: 1 }];
      this.angle = 0;
      this.spinning = false;
      this.flapperAngle = 0;
      this.flapperVel = 0;
      this.bulbTick = 0;
      this.highlightIdx = -1;
      this._lastSliceIdx = -1;
      this._raf = null;
      this._destroyed = false;
      this._idleStart();
    }

    setRewards(rewards) {
      if (Array.isArray(rewards) && rewards.length >= 2) {
        this.rewards = rewards;
        if (!this.spinning) this.highlightIdx = -1;
        this.draw();
      }
    }

    _idleStart() {
      let last = performance.now();
      const loop = (now) => {
        if (this._destroyed) return;
        const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
        last = now;
        this.bulbTick += dt * (this.spinning ? 9 : 2.2);

        if (this.spinning && this._spinState) {
          const st = this._spinState;
          st.elapsed += dt;
          const t = Math.min(1, st.elapsed / st.duration);
          /* Đường cong giảm tốc ma sát vật lý mượt (quintic ease-out) */
          const eased = 1 - Math.pow(1 - t, 4.2);
          const prevAngle = this.angle;
          this.angle = st.startAngle + st.totalDelta * eased;
          const omega = (this.angle - prevAngle) / Math.max(0.001, dt);

          /* Kiểm tra đinh chốt chạm kim gạt lò xo ở đỉnh (-PI/2) */
          const n = this.rewards.length;
          const arc = (Math.PI * 2) / n;
          const norm = (((-Math.PI / 2 - this.angle) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
          const curIdx = Math.floor(norm / arc);
          if (curIdx !== this._lastSliceIdx && this._lastSliceIdx !== -1) {
            this.flapperVel = -Math.min(14, 4.5 + omega * 0.55);
            KawaiiSFX.playTick(Math.min(1, omega / 18));
          }
          this._lastSliceIdx = curIdx;

          if (t >= 1) {
            this.spinning = false;
            this.highlightIdx = st.winIdx;
            const won = this.rewards[st.winIdx];
            const cb = st.onComplete;
            this._spinState = null;
            KawaiiSFX.playFanfare();
            if (cb) cb(won);
          }
        }

        /* Vật lý lò xo giảm chấn cho kim chỉ vòng quay */
        const springK = 190;
        const damping = 14;
        const acc = -springK * this.flapperAngle - damping * this.flapperVel;
        this.flapperVel += acc * dt;
        this.flapperAngle += this.flapperVel * dt;
        this.flapperAngle = Math.max(-0.68, Math.min(0.22, this.flapperAngle));

        this.draw();
        this._raf = requestAnimationFrame(loop);
      };
      this._raf = requestAnimationFrame(loop);
    }

    spin(onComplete) {
      if (this.spinning || !this.rewards.length) return false;
      /* Chọn phần thưởng theo trọng số xác suất (weight) */
      const totalW = this.rewards.reduce((s, r) => s + Math.max(0.1, Number(r.weight) || 1), 0);
      let pick = Math.random() * totalW;
      let winIdx = 0;
      for (let i = 0; i < this.rewards.length; i++) {
        pick -= Math.max(0.1, Number(this.rewards[i].weight) || 1);
        if (pick <= 0) {
          winIdx = i;
          break;
        }
      }

      const n = this.rewards.length;
      const arc = (Math.PI * 2) / n;
      /* Vị trí góc dừng nằm gọn trong lòng múi thắng (tránh sát vạch) */
      const offsetInSlice = (0.24 + Math.random() * 0.52) * arc;
      const desiredMod = (((-Math.PI / 2 - (winIdx * arc + offsetInSlice)) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const curMod = ((this.angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      let diff = desiredMod - curMod;
      if (diff <= 0) diff += Math.PI * 2;

      const extraTurns = (6 + Math.floor(Math.random() * 3)) * Math.PI * 2;
      this.highlightIdx = -1;
      this._lastSliceIdx = -1;
      this.spinning = true;
      this._spinState = {
        startAngle: this.angle,
        totalDelta: extraTurns + diff,
        duration: 4.8 + Math.random() * 0.7,
        elapsed: 0,
        winIdx,
        onComplete,
      };
      return true;
    }

    draw() {
      const { ctx, width: w, height: h } = this.hi;
      if (!w || !h) return;
      this.hi.clear();

      const cx = w / 2;
      const cy = h / 2 + 6;
      const outerR = Math.min(w, h) * 0.44;
      const wheelR = outerR - 15;
      const n = this.rewards.length;
      const arc = (Math.PI * 2) / n;

      /* Đế bóng 3D của vòng quay */
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy + 9, outerR + 2, 0, Math.PI * 2);
      ctx.fillStyle = '#3B261D';
      ctx.fill();

      /* Vành ngoài vàng mật ong 3D */
      const rimGrad = ctx.createLinearGradient(cx, cy - outerR, cx, cy + outerR);
      rimGrad.addColorStop(0, '#FFE484');
      rimGrad.addColorStop(0.5, '#FFC233');
      rimGrad.addColorStop(1, '#E59812');
      ctx.beginPath();
      ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
      ctx.fillStyle = rimGrad;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#3B261D';
      ctx.stroke();

      /* Đèn LED lễ hội chạy quanh vành */
      const bulbCount = 16;
      const bulbR = (outerR + wheelR) * 0.5;
      for (let i = 0; i < bulbCount; i++) {
        const ba = (Math.PI * 2 * i) / bulbCount;
        const bx = cx + Math.cos(ba) * bulbR;
        const by = cy + Math.sin(ba) * bulbR;
        const lit = (Math.floor(this.bulbTick) + i) % 2 === 0;
        ctx.beginPath();
        ctx.arc(bx, by, 4.3, 0, Math.PI * 2);
        ctx.fillStyle = lit ? '#FFFDF5' : '#FF7B9C';
        ctx.fill();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = '#3B261D';
        ctx.stroke();
      }

      /* Vẽ từng múi phần thưởng */
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(this.angle);

      for (let i = 0; i < n; i++) {
        const r = this.rewards[i];
        const a0 = i * arc;
        const a1 = a0 + arc;
        const mid = a0 + arc * 0.5;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, wheelR, a0, a1);
        ctx.closePath();
        ctx.fillStyle = r.color || KAWAII_PALETTE[i % KAWAII_PALETTE.length];
        ctx.fill();

        if (this.highlightIdx === i) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.32)';
          ctx.fill();
        }

        ctx.lineWidth = 2.8;
        ctx.strokeStyle = '#3B261D';
        ctx.stroke();

        /* Icon & tên món quà rõ nét */
        ctx.save();
        ctx.rotate(mid);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        const iconSize = Math.max(17, Math.round(wheelR * 0.165));
        ctx.font = `${iconSize}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        ctx.fillText(r.icon || '🎁', wheelR - 12, 0);

        const fontSize = Math.max(10, Math.round(wheelR * 0.082));
        ctx.font = `900 ${fontSize}px Nunito, ui-rounded, system-ui, sans-serif`;
        ctx.fillStyle = '#3B261D';
        const shortLabel = this._truncate(ctx, r.label || '', wheelR * 0.52);
        ctx.fillText(shortLabel, wheelR - iconSize - 17, 0);
        ctx.restore();
      }

      /* Đinh chốt kim loại giữa các múi */
      for (let i = 0; i < n; i++) {
        const a = i * arc;
        const px = Math.cos(a) * (wheelR - 3);
        const py = Math.sin(a) * (wheelR - 3);
        ctx.beginPath();
        ctx.arc(px, py, 4.2, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#3B261D';
        ctx.stroke();
      }

      /* Viền bóng kính nhẹ trên mặt bánh xe */
      const gloss = ctx.createRadialGradient(-wheelR * 0.25, -wheelR * 0.3, 8, 0, 0, wheelR);
      gloss.addColorStop(0, 'rgba(255,255,255,0.28)');
      gloss.addColorStop(0.6, 'rgba(255,255,255,0)');
      gloss.addColorStop(1, 'rgba(59,38,29,0.08)');
      ctx.beginPath();
      ctx.arc(0, 0, wheelR, 0, Math.PI * 2);
      ctx.fillStyle = gloss;
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#3B261D';
      ctx.stroke();

      ctx.restore();

      /* Tâm vòng quay ngôi sao Kawaii 3D */
      const hubR = Math.max(24, wheelR * 0.2);
      ctx.beginPath();
      ctx.arc(cx, cy + 3, hubR, 0, Math.PI * 2);
      ctx.fillStyle = '#3B261D';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, hubR, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFDF9';
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#3B261D';
      ctx.stroke();

      HiDPICanvas.drawStar(ctx, cx, cy, 5, hubR * 0.62, hubR * 0.3);
      ctx.fillStyle = '#FFCA42';
      ctx.fill();
      ctx.lineWidth = 2.4;
      ctx.strokeStyle = '#3B261D';
      ctx.stroke();

      /* Kim gạt lò xo ở đỉnh 12 giờ */
      ctx.save();
      ctx.translate(cx, cy - outerR - 2);
      ctx.rotate(this.flapperAngle);
      ctx.beginPath();
      ctx.moveTo(-14, -8);
      ctx.lineTo(14, -8);
      ctx.lineTo(0, 28);
      ctx.closePath();
      ctx.fillStyle = '#FF5D73';
      ctx.fill();
      ctx.lineWidth = 3.5;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#3B261D';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, -6, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#FFCA42';
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    _truncate(ctx, str, maxW) {
      if (ctx.measureText(str).width <= maxW) return str;
      let s = str;
      while (s.length > 3 && ctx.measureText(s + '…').width > maxW) {
        s = s.slice(0, -1);
      }
      return s + '…';
    }

    destroy() {
      this._destroyed = true;
      if (this._raf) cancelAnimationFrame(this._raf);
      this.hi.destroy();
    }
  }

  /* ------------------------------------------------------------------------
     8. StarCatcherEngine — Mini-game Hứng Sao Yêu Thương 60fps HiDPI Canvas
     ------------------------------------------------------------------------ */
  class StarCatcherEngine {
    constructor(canvas, { onFinish, onState }) {
      this.canvas = canvas;
      this.hi = new HiDPICanvas(canvas, () => { if (this.hi) this.draw(); });
      this.onFinish = onFinish || null;
      this.onState = onState || null;

      this.running = false;
      this.score = 0;
      this.lives = 3;
      this.combo = 0;
      this.timeLeft = 35;
      this.playerX = 0.5; // tỉ lệ 0..1
      this.targetX = 0.5;
      this.mood = 'happy';
      this.moodTimer = 0;
      this.items = [];
      this.pops = [];
      this.spawnTimer = 0;
      this.keys = { left: false, right: false };
      this._raf = null;
      this._destroyed = false;

      this._bindControls();
      this.draw();
    }

    _bindControls() {
      this._onPointer = (e) => {
        const rect = this.canvas.getBoundingClientRect();
        if (!rect.width) return;
        const ratio = (e.clientX - rect.left) / rect.width;
        this.targetX = Math.max(0.09, Math.min(0.91, ratio));
      };
      this._onKeyDown = (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = true;
      };
      this._onKeyUp = (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.keys.right = false;
      };
      this.canvas.addEventListener('pointermove', this._onPointer);
      this.canvas.addEventListener('pointerdown', this._onPointer);
      global.addEventListener('keydown', this._onKeyDown);
      global.addEventListener('keyup', this._onKeyUp);
    }

    start() {
      this.running = true;
      this.score = 0;
      this.lives = 3;
      this.combo = 0;
      this.timeLeft = 35;
      this.items = [];
      this.pops = [];
      this.mood = 'excited';
      this.moodTimer = 1;
      this.spawnTimer = 0.2;
      KawaiiSFX.playSelect();
      this._emitState();

      if (this._raf) cancelAnimationFrame(this._raf);
      let last = performance.now();
      const loop = (now) => {
        if (this._destroyed || !this.running) return;
        const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
        last = now;
        this._update(dt);
        this.draw();
        if (this.running) {
          this._raf = requestAnimationFrame(loop);
        }
      };
      this._raf = requestAnimationFrame(loop);
    }

    _emitState() {
      if (this.onState) {
        this.onState({
          running: this.running,
          score: this.score,
          lives: this.lives,
          combo: this.combo,
          timeLeft: Math.ceil(this.timeLeft),
        });
      }
    }

    _spawnItem() {
      const w = this.hi.width || 500;
      const r = Math.random();
      let kind = 'star';
      if (r > 0.86) kind = 'gift';
      else if (r > 0.66) kind = 'heart';
      else if (r < 0.2) kind = 'cloud';

      const speedBoost = 1 + (35 - this.timeLeft) * 0.015;
      this.items.push({
        kind,
        x: 34 + Math.random() * Math.max(60, w - 68),
        y: -26,
        vy: (128 + Math.random() * 88) * speedBoost,
        wobble: Math.random() * Math.PI * 2,
        rot: 0,
        vrot: (Math.random() - 0.5) * 3,
      });
    }

    _update(dt) {
      const w = this.hi.width || 500;
      const h = this.hi.height || 360;

      const prevSec = Math.ceil(this.timeLeft);
      this.timeLeft -= dt;
      if (this.timeLeft <= 0 || this.lives <= 0) {
        this.timeLeft = Math.max(0, this.timeLeft);
        this.running = false;
        this._emitState();
        this.draw();
        if (this.onFinish) this.onFinish({ score: this.score, lives: this.lives });
        return;
      }

      if (this.keys.left) this.targetX = Math.max(0.09, this.targetX - dt * 0.85);
      if (this.keys.right) this.targetX = Math.min(0.91, this.targetX + dt * 0.85);
      this.playerX += (this.targetX - this.playerX) * Math.min(1, dt * 15);

      if (this.moodTimer > 0) {
        this.moodTimer -= dt;
        if (this.moodTimer <= 0) this.mood = 'happy';
      }

      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        this._spawnItem();
        this.spawnTimer = Math.max(0.34, 0.62 - (35 - this.timeLeft) * 0.006);
      }

      const px = this.playerX * w;
      const py = h - 46;
      const catchW = 46;

      for (let i = this.items.length - 1; i >= 0; i--) {
        const it = this.items[i];
        it.wobble += dt * 3;
        it.y += it.vy * dt;
        it.x += Math.sin(it.wobble) * 18 * dt;
        it.rot += it.vrot * dt;

        const dx = Math.abs(it.x - px);
        const dy = Math.abs(it.y - py);
        if (dx < catchW && dy < 32) {
          this.items.splice(i, 1);
          if (it.kind === 'cloud') {
            this.lives -= 1;
            this.combo = 0;
            this.mood = 'shocked';
            this.moodTimer = 0.8;
            this.pops.push({ x: it.x, y: py - 24, text: 'Ái chà! ⛈️', color: '#FF5D73', life: 1 });
            KawaiiSFX.playOops();
          } else {
            this.combo += 1;
            const bonus = this.combo >= 5 ? 2 : 0;
            const pts = (it.kind === 'gift' ? 8 : it.kind === 'heart' ? 5 : 3) + bonus;
            this.score += pts;
            this.mood = it.kind === 'heart' || it.kind === 'gift' ? 'lovestruck' : 'excited';
            this.moodTimer = 0.65;
            this.pops.push({
              x: it.x,
              y: py - 24,
              text: `+${pts}${bonus ? ' 🔥' : ''}`,
              color: it.kind === 'heart' ? '#FF7B9C' : '#FFCA42',
              life: 1,
            });
            if (it.kind === 'heart' || it.kind === 'gift') KawaiiSFX.playHeart();
            else KawaiiSFX.playPop();
          }
          this._emitState();
          continue;
        }

        if (it.y > h + 30) {
          if (it.kind !== 'cloud') this.combo = 0;
          this.items.splice(i, 1);
        }
      }

      for (let i = this.pops.length - 1; i >= 0; i--) {
        const pp = this.pops[i];
        pp.y -= dt * 52;
        pp.life -= dt * 1.3;
        if (pp.life <= 0) this.pops.splice(i, 1);
      }

      if (Math.ceil(this.timeLeft) !== prevSec) {
        this._emitState();
      }
    }

    draw() {
      const { ctx, width: w, height: h } = this.hi;
      if (!w || !h) return;
      this.hi.clear();

      /* Nền trời Kawaii tươi sáng */
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#CBEFFF');
      sky.addColorStop(0.7, '#FFF8E8');
      sky.addColorStop(1, '#D5F7E5');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      /* Ông mặt trời mỉm cười */
      ctx.save();
      ctx.beginPath();
      ctx.arc(w - 54, 50, 26, 0, Math.PI * 2);
      ctx.fillStyle = '#FFE074';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#3B261D';
      ctx.stroke();
      ctx.restore();

      HiDPICanvas.drawCloud(ctx, w * 0.2, 54, 0.9, 'rgba(255,255,255,0.92)');
      HiDPICanvas.drawCloud(ctx, w * 0.62, 76, 0.72, 'rgba(255,255,255,0.85)');

      /* Đồi cỏ bạc hà */
      ctx.fillStyle = '#8CEAB9';
      ctx.beginPath();
      ctx.ellipse(w * 0.28, h + 12, w * 0.45, 58, 0, Math.PI, 0);
      ctx.ellipse(w * 0.78, h + 14, w * 0.42, 52, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#52E0A0';
      ctx.fillRect(0, h - 22, w, 22);
      ctx.strokeStyle = '#3B261D';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, h - 22);
      ctx.lineTo(w, h - 22);
      ctx.stroke();

      /* Vật phẩm rơi */
      for (const it of this.items) {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.rot);
        ctx.lineWidth = 2.6;
        ctx.strokeStyle = '#3B261D';
        if (it.kind === 'star') {
          HiDPICanvas.drawStar(ctx, 0, 0, 5, 16, 7.5);
          ctx.fillStyle = '#FFCA42';
          ctx.fill();
          ctx.stroke();
        } else if (it.kind === 'heart') {
          HiDPICanvas.drawHeart(ctx, 0, 0, 28);
          ctx.fillStyle = '#FF7B9C';
          ctx.fill();
          ctx.stroke();
        } else if (it.kind === 'gift') {
          HiDPICanvas.roundRect(ctx, -14, -13, 28, 26, 6);
          ctx.fillStyle = '#B997FC';
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#FFCA42';
          ctx.fillRect(-4, -13, 8, 26);
          ctx.fillRect(-14, -3, 28, 6);
          ctx.strokeRect(-14, -13, 28, 26);
        } else {
          HiDPICanvas.drawCloud(ctx, 0, 0, 0.75, '#8FA3B8', '#3B261D');
          /* Khuôn mặt mây tinh nghịch */
          ctx.fillStyle = '#3B261D';
          ctx.beginPath();
          ctx.arc(-6, 2, 2.2, 0, Math.PI * 2);
          ctx.arc(6, 2, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      /* Nhân vật Mèo Kawaii cầm giỏ hứng sao */
      const px = this.playerX * w;
      const py = h - 42;
      this._drawKawaiiCatBasket(ctx, px, py);

      /* Chữ điểm nổi */
      for (const pp of this.pops) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, pp.life * 1.4);
        ctx.font = '900 15px Nunito, ui-rounded, sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#FFFFFF';
        ctx.strokeText(pp.text, pp.x, pp.y);
        ctx.fillStyle = '#3B261D';
        ctx.fillText(pp.text, pp.x, pp.y);
        ctx.restore();
      }

      /* HUD tự thu tỉ lệ để hiển thị đủ trên màn hình điện thoại hẹp. */
      ctx.save();
      const hudScale = Math.min(1, Math.max(0.55, (w - 6) / 315));
      ctx.scale(hudScale, hudScale);
      HiDPICanvas.roundRect(ctx, 12, 12, 134, 34, 17);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#3B261D';
      ctx.stroke();
      ctx.font = '900 14px Nunito, ui-rounded, sans-serif';
      ctx.fillStyle = '#3B261D';
      ctx.textBaseline = 'middle';
      ctx.fillText(`⭐ Điểm: ${this.score}`, 24, 30);

      HiDPICanvas.roundRect(ctx, 154, 12, 92, 34, 17);
      ctx.fillStyle = this.timeLeft <= 8 && this.running ? '#FFE0E6' : '#FFFFFF';
      ctx.fill();
      ctx.stroke();
      ctx.fillText(`⏱️ ${Math.ceil(this.timeLeft)}s`, 168, 30);

      const hearts = '❤️'.repeat(Math.max(0, this.lives)) + '🤍'.repeat(Math.max(0, 3 - this.lives));
      ctx.font = '16px sans-serif';
      ctx.fillText(hearts, 256, 30);
      ctx.restore();
    }

    _drawKawaiiCatBasket(ctx, x, y) {
      ctx.save();
      ctx.translate(x, y);
      /* Bóng dưới chân */
      ctx.fillStyle = 'rgba(59,38,29,0.18)';
      ctx.beginPath();
      ctx.ellipse(0, 22, 36, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      /* Tai mèo Kawaii */
      ctx.fillStyle = '#FFCA42';
      ctx.strokeStyle = '#3B261D';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-28, -8);
      ctx.lineTo(-22, -26);
      ctx.lineTo(-8, -14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(28, -8);
      ctx.lineTo(22, -26);
      ctx.lineTo(8, -14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      /* Thân giỏ mèo tròn mũm mĩm */
      HiDPICanvas.roundRect(ctx, -36, -15, 72, 36, 16);
      ctx.fillStyle = '#FFCA42';
      ctx.fill();
      ctx.stroke();

      /* Má hồng Kawaii */
      ctx.fillStyle = '#FF7B9C';
      ctx.beginPath();
      ctx.ellipse(-18, 5, 5.5, 3.5, 0, 0, Math.PI * 2);
      ctx.ellipse(18, 5, 5.5, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();

      /* Đôi mắt & miệng theo cảm xúc */
      ctx.fillStyle = '#3B261D';
      ctx.strokeStyle = '#3B261D';
      ctx.lineWidth = 2.4;
      if (this.mood === 'lovestruck') {
        ctx.fillStyle = '#FF5D73';
        HiDPICanvas.drawHeart(ctx, -11, -1, 10);
        ctx.fill();
        HiDPICanvas.drawHeart(ctx, 11, -1, 10);
        ctx.fill();
      } else if (this.mood === 'shocked') {
        ctx.beginPath();
        ctx.arc(-11, -1, 3.5, 0, Math.PI * 2);
        ctx.arc(11, -1, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 8, 4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        return;
      } else {
        ctx.beginPath();
        ctx.arc(-11, -1, 3.2, 0, Math.PI * 2);
        ctx.arc(11, -1, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
      /* Miệng cười chữ w kiểu mèo Kawaii */
      ctx.beginPath();
      ctx.arc(-3.5, 5, 3.5, 0, Math.PI);
      ctx.arc(3.5, 5, 3.5, 0, Math.PI);
      ctx.stroke();
      ctx.restore();
    }

    destroy() {
      this._destroyed = true;
      this.running = false;
      if (this._raf) cancelAnimationFrame(this._raf);
      this.canvas.removeEventListener('pointermove', this._onPointer);
      this.canvas.removeEventListener('pointerdown', this._onPointer);
      global.removeEventListener('keydown', this._onKeyDown);
      global.removeEventListener('keyup', this._onKeyUp);
      this.hi.destroy();
    }
  }

  /* ------------------------------------------------------------------------
     9. VoiceWaveRenderer — Sóng âm thanh ghi âm độ nét cao
     ------------------------------------------------------------------------ */
  class VoiceWaveRenderer {
    constructor(canvas) {
      this.hi = new HiDPICanvas(canvas);
      this._raf = null;
      this.drawIdle();
    }

    drawIdle() {
      const { ctx, width: w, height: h } = this.hi;
      this.hi.clear();
      const bars = 24;
      const gap = 5;
      const bw = Math.max(4, (w - 28 - gap * (bars - 1)) / bars);
      for (let i = 0; i < bars; i++) {
        const bh = 8 + Math.sin(i * 0.6) * 4;
        const x = 14 + i * (bw + gap);
        const y = (h - bh) / 2;
        HiDPICanvas.roundRect(ctx, x, y, bw, bh, bw / 2);
        ctx.fillStyle = KAWAII_PALETTE[i % KAWAII_PALETTE.length];
        ctx.globalAlpha = 0.45;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    startAnalyser(analyser) {
      this.stop();
      const data = new Uint8Array(analyser.frequencyBinCount);
      const loop = () => {
        analyser.getByteFrequencyData(data);
        const { ctx, width: w, height: h } = this.hi;
        this.hi.clear();
        const bars = 24;
        const gap = 5;
        const bw = Math.max(4, (w - 28 - gap * (bars - 1)) / bars);
        for (let i = 0; i < bars; i++) {
          const val = data[Math.min(data.length - 1, i * 2)] / 255;
          const bh = Math.max(8, val * (h - 14));
          const x = 14 + i * (bw + gap);
          const y = (h - bh) / 2;
          HiDPICanvas.roundRect(ctx, x, y, bw, bh, bw / 2);
          ctx.fillStyle = KAWAII_PALETTE[i % KAWAII_PALETTE.length];
          ctx.fill();
          ctx.strokeStyle = '#3B261D';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        this._raf = requestAnimationFrame(loop);
      };
      this._raf = requestAnimationFrame(loop);
    }

    stop() {
      if (this._raf) cancelAnimationFrame(this._raf);
      this._raf = null;
      this.drawIdle();
    }

    destroy() {
      this.stop();
      this.hi.destroy();
    }
  }

  /* Xuất API ra window.DiaryEngine */
  global.DiaryEngine = {
    CANNON,
    KawaiiSFX,
    HiDPICanvas,
    VFX,
    GroundCanvas,
    CSS3DRenderer,
    DiaryPhysicsWorld,
    LuckyWheelEngine,
    StarCatcherEngine,
    VoiceWaveRenderer,
  };
})(window);
