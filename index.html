<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff8ee"><title>Nhật ký cha &amp; con</title><style>/* ==========================================================================
   NHẬT KÝ CHA & CON — styles.css
   Phong cách: react-kawaii Pastel Ấm Áp + Nút & Input Hoạt Hình 3D Sống Động
   ========================================================================== */

:root {
  /* Bảng màu Kawaii nắng ấm */
  --bg-cream: #FFF8EE;
  --bg-paper: #FFFDF9;
  --bg-peach-soft: #FFEFE5;
  --bg-mint-soft: #E9FBF2;
  --bg-sky-soft: #EAF6FF;
  --bg-sunny-soft: #FFF5D6;
  --bg-pink-soft: #FFF0F5;
  --bg-lilac-soft: #F4EEFF;

  /* Màu chủ đạo hoạt hình */
  --sun: #FFCA42;
  --sun-dark: #D69012;
  --sun-light: #FFE48F;

  --coral: #FF7B9C;
  --coral-dark: #CE4468;
  --coral-light: #FFB3C6;

  --mint: #52E0A0;
  --mint-dark: #1E9E66;
  --mint-light: #A5F3CE;

  --sky: #63C7FF;
  --sky-dark: #228BC7;
  --sky-light: #B5E6FF;

  --apricot: #FF9F59;
  --apricot-dark: #CC6922;

  --lilac: #B997FC;
  --lilac-dark: #7C54C9;

  --berry: #FF5D73;
  --berry-dark: #C22942;

  /* Viền & chữ màu cacao ấm (dễ thương, không gắt) */
  --ink: #3B261D;
  --ink-soft: #6E5244;
  --ink-muted: #9B7E6F;
  --cream-edge: #E5D2BE;
  --cream-edge-dark: #CBB39B;

  /* Thông số hình học 3D */
  --border-w: 3px;
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --radius-pill: 999px;

  /* Easing hoạt hình nảy đàn hồi */
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-snappy: cubic-bezier(0.22, 1, 0.36, 1);

  /* Phông chữ tròn thân thiện hỗ trợ tiếng Việt hoàn hảo */
  --font-main: 'Nunito', 'Quicksand', 'Segoe UI Rounded', 'SF Pro Rounded',
    ui-rounded, 'Segoe UI', system-ui, -apple-system, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: var(--font-main);
  color: var(--ink);
  background-color: var(--bg-cream);
  background-image:
    radial-gradient(circle at 12% 10%, rgba(255, 202, 66, 0.22) 0%, transparent 28%),
    radial-gradient(circle at 88% 14%, rgba(255, 123, 156, 0.18) 0%, transparent 26%),
    radial-gradient(circle at 82% 84%, rgba(82, 224, 160, 0.18) 0%, transparent 28%),
    radial-gradient(#EBDAC7 1.6px, transparent 1.6px);
  background-size: 100% 100%, 100% 100%, 100% 100%, 26px 26px;
  overflow-x: hidden;
  line-height: 1.5;
}

button, input, textarea, select {
  font-family: inherit;
  color: inherit;
}

input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear {
  display: none;
}

/* ---------- VFX Canvas toàn màn hình ---------- */
#vfx-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 9999;
}

/* ---------- Khung bố cục chính ---------- */
.app-shell {
  max-width: 1060px;
  margin: 0 auto;
  padding: 16px 16px 104px;
  position: relative;
  z-index: 1;
}

/* ==========================================================================
   HOẠT ẢNH CHUYỂN ĐỘNG HOẠT HÌNH 3D & REACT-KAWAII
   ========================================================================== */

@keyframes kawaiiJellySelect {
  0%   { transform: translateY(0) scale(1, 1); }
  25%  { transform: translateY(-5px) scale(1.09, 0.92); }
  50%  { transform: translateY(-3px) scale(0.95, 1.07); }
  75%  { transform: translateY(-4px) scale(1.03, 0.98); }
  100% { transform: translateY(-3px) scale(1.02, 1.02); }
}

@keyframes kawaiiInputPop {
  0%   { transform: translateY(0) scale(1); }
  35%  { transform: translateY(-4px) scale(1.025, 0.97); }
  70%  { transform: translateY(-2px) scale(0.99, 1.015); }
  100% { transform: translateY(-3px) scale(1.008); }
}

@keyframes kawaiiFloat {
  0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
  50%      { transform: translateY(-8px) rotate(1.8deg); }
}

@keyframes kawaiiHappyHop {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  18%      { transform: translateY(2px) scale(1.08, 0.92); }
  45%      { transform: translateY(-14px) scale(0.95, 1.06); }
  72%      { transform: translateY(1px) scale(1.04, 0.96); }
}

@keyframes kawaiiWiggle {
  0%, 100% { transform: rotate(0deg) scale(1); }
  20%      { transform: rotate(-8deg) scale(1.08); }
  45%      { transform: rotate(8deg) scale(1.1); }
  70%      { transform: rotate(-4deg) scale(1.04); }
}

@keyframes pulseRing {
  0%   { box-shadow: 0 0 0 0 rgba(255, 93, 115, 0.55), 0 6px 0 var(--berry-dark); }
  70%  { box-shadow: 0 0 0 14px rgba(255, 93, 115, 0), 0 6px 0 var(--berry-dark); }
  100% { box-shadow: 0 0 0 0 rgba(255, 93, 115, 0), 0 6px 0 var(--berry-dark); }
}

@keyframes sparkleSpin {
  0%   { transform: scale(0) rotate(-45deg); opacity: 0; }
  55%  { transform: scale(1.25) rotate(12deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes cardPopIn {
  0%   { opacity: 0; transform: translateY(14px) scale(0.96); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes shineSweep {
  0%   { transform: translateX(-140%) skewX(-22deg); }
  100% { transform: translateX(260%) skewX(-22deg); }
}

@keyframes shakeNo {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-8px) rotate(-2deg); }
  40%      { transform: translateX(8px) rotate(2deg); }
  60%      { transform: translateX(-6px); }
  80%      { transform: translateX(6px); }
}

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  30%      { transform: scale(1.18); }
  60%      { transform: scale(0.96); }
}

/* Nhân vật react-kawaii sống động */
.kawaii-avatar {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  user-select: none;
  cursor: pointer;
  transition: transform 0.25s var(--ease-bounce);
}

.kawaii-avatar .kawaii-figure {
  animation: kawaiiFloat 3.4s ease-in-out infinite;
  filter: drop-shadow(0 6px 0 rgba(59, 38, 29, 0.1));
  transition: transform 0.25s var(--ease-bounce);
}

.kawaii-avatar.delay-1 .kawaii-figure {
  animation-delay: -1.4s;
}

.kawaii-avatar:hover .kawaii-figure,
.kawaii-avatar.is-hopping .kawaii-figure {
  animation: kawaiiHappyHop 0.65s var(--ease-bounce);
}

.kawaii-avatar::after {
  content: '';
  width: 62%;
  height: 10px;
  border-radius: 50%;
  background: rgba(59, 38, 29, 0.12);
  margin-top: 2px;
}

/* ==========================================================================
   HỆ THỐNG NÚT BẤM 3D PHONG CÁCH HOẠT HÌNH (btn-3d)
   ========================================================================== */

.btn-3d {
  --btn-bg: #FFFFFF;
  --btn-edge: var(--cream-edge-dark);
  --btn-text: var(--ink);
  --btn-depth: 6px;

  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 20px;
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--ink);
  background: var(--btn-bg);
  color: var(--btn-text);
  font-weight: 800;
  font-size: 0.98rem;
  letter-spacing: 0.01em;
  cursor: pointer;
  user-select: none;
  text-decoration: none;
  overflow: hidden;
  box-shadow:
    0 var(--btn-depth) 0 var(--ink),
    inset 0 -4px 0 rgba(0, 0, 0, 0.11),
    inset 0 3px 0 rgba(255, 255, 255, 0.65);
  transform: translateY(0);
  transition:
    transform 0.14s var(--ease-bounce),
    box-shadow 0.14s var(--ease-bounce),
    background-color 0.18s ease,
    filter 0.18s ease;
}

/* Ánh kính bóng hoạt hình trên đỉnh nút */
.btn-3d::before {
  content: '';
  position: absolute;
  top: 3px;
  left: 12px;
  right: 12px;
  height: 5px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.48);
  pointer-events: none;
}

.btn-3d:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow:
    0 calc(var(--btn-depth) + 2px) 0 var(--ink),
    inset 0 -4px 0 rgba(0, 0, 0, 0.11),
    inset 0 3px 0 rgba(255, 255, 255, 0.75);
  filter: brightness(1.03);
}

.btn-3d:active:not(:disabled) {
  transform: translateY(calc(var(--btn-depth) - 1px)) scale(0.98, 0.96);
  box-shadow:
    0 1px 0 var(--ink),
    inset 0 2px 0 rgba(0, 0, 0, 0.08);
  transition-duration: 0.05s;
}

.btn-3d:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  filter: grayscale(0.25);
}

/* Khi nút 3D được CHỌN — nảy Jelly + viền sáng hào quang */
.btn-3d.is-selected {
  animation: kawaiiJellySelect 0.46s var(--ease-bounce) forwards;
  box-shadow:
    0 calc(var(--btn-depth) + 2px) 0 var(--ink),
    0 0 0 5px rgba(255, 202, 66, 0.55),
    inset 0 -4px 0 rgba(0, 0, 0, 0.12),
    inset 0 3px 0 rgba(255, 255, 255, 0.8);
}

/* Các biến thể màu kẹo Kawaii */
.btn-sun     { --btn-bg: var(--sun);     --btn-edge: var(--sun-dark); }
.btn-coral   { --btn-bg: var(--coral);   --btn-edge: var(--coral-dark); --btn-text: #3B1822; }
.btn-mint    { --btn-bg: var(--mint);    --btn-edge: var(--mint-dark);  --btn-text: #143627; }
.btn-sky     { --btn-bg: var(--sky);     --btn-edge: var(--sky-dark);   --btn-text: #142F42; }
.btn-apricot { --btn-bg: var(--apricot); --btn-edge: var(--apricot-dark); }
.btn-lilac   { --btn-bg: var(--lilac);   --btn-edge: var(--lilac-dark); --btn-text: #271845; }
.btn-berry   { --btn-bg: var(--berry);   --btn-edge: var(--berry-dark); --btn-text: #FFFFFF; }
.btn-cream   { --btn-bg: #FFFDF8;        --btn-edge: var(--cream-edge-dark); }

.btn-sm {
  --btn-depth: 4px;
  padding: 7px 14px;
  font-size: 0.86rem;
  border-radius: var(--radius-sm);
  border-width: 2.5px;
}

.btn-lg {
  --btn-depth: 7px;
  padding: 14px 28px;
  font-size: 1.1rem;
  border-radius: 20px;
}

.btn-pill {
  border-radius: var(--radius-pill);
}

.btn-recording {
  animation: pulseRing 1.25s infinite;
}

/* Vệt sáng lấp lánh chạy ngang nút đặc biệt */
.btn-shine::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 36%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  transform: translateX(-140%) skewX(-22deg);
  animation: shineSweep 3.2s ease-in-out infinite;
  pointer-events: none;
}

/* ==========================================================================
   HỆ THỐNG INPUT / TEXTAREA / SELECT / CHOICE 3D CÓ HOẠT ẢNH KHI CHỌN
   ========================================================================== */

.field-3d-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-3d-label {
  font-weight: 800;
  font-size: 0.9rem;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.input-3d,
.textarea-3d,
.select-3d {
  width: 100%;
  padding: 13px 16px;
  border-radius: var(--radius-md);
  border: var(--border-w) solid var(--ink);
  background: #FFFFFF;
  color: var(--ink);
  font-size: 1rem;
  font-weight: 700;
  outline: none;
  box-shadow:
    0 5px 0 var(--ink),
    inset 0 3px 0 rgba(59, 38, 29, 0.05);
  transform: translateY(0) scale(1);
  transition:
    transform 0.22s var(--ease-bounce),
    box-shadow 0.22s var(--ease-bounce),
    background-color 0.2s ease,
    border-color 0.2s ease;
}

.input-3d::placeholder,
.textarea-3d::placeholder {
  color: #B49A8B;
  font-weight: 600;
}

.input-3d:hover,
.textarea-3d:hover,
.select-3d:hover {
  background: #FFFEFA;
  transform: translateY(-1px);
  box-shadow:
    0 6px 0 var(--ink),
    inset 0 3px 0 rgba(59, 38, 29, 0.04);
}

/* Hoạt ảnh chuyển động nảy 3D khi click/focus vào ô input */
.input-3d:focus,
.textarea-3d:focus,
.select-3d:focus {
  background: #FFFDF4;
  animation: kawaiiInputPop 0.42s var(--ease-bounce) forwards;
  box-shadow:
    0 7px 0 var(--ink),
    0 0 0 5px rgba(255, 202, 66, 0.58),
    inset 0 -3px 0 rgba(255, 202, 66, 0.22);
}

.textarea-3d {
  min-height: 92px;
  resize: vertical;
  line-height: 1.5;
}

/* Nút Sticker / Icon 3D khi bé chọn gửi cho Cha */
.sticker-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
  gap: 12px;
}

.sticker-3d {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 13px 10px;
  border-radius: 20px;
  border: var(--border-w) solid var(--ink);
  background: #FFFFFF;
  cursor: pointer;
  user-select: none;
  box-shadow:
    0 6px 0 var(--ink),
    inset 0 -4px 0 rgba(59, 38, 29, 0.06),
    inset 0 3px 0 rgba(255, 255, 255, 0.9);
  transition:
    transform 0.2s var(--ease-bounce),
    box-shadow 0.2s var(--ease-bounce),
    background-color 0.2s ease;
}

.sticker-3d .sticker-emoji {
  font-size: 2.1rem;
  line-height: 1.1;
  transition: transform 0.25s var(--ease-bounce);
}

.sticker-3d .sticker-label {
  font-size: 0.82rem;
  font-weight: 800;
  text-align: center;
  color: var(--ink);
  line-height: 1.25;
}

.sticker-3d:hover {
  transform: translateY(-3px);
  background: var(--bg-sunny-soft);
  box-shadow: 0 9px 0 var(--ink);
}

.sticker-3d:hover .sticker-emoji {
  transform: scale(1.16) rotate(-6deg);
}

.sticker-3d:active {
  transform: translateY(4px) scale(0.96);
  box-shadow: 0 2px 0 var(--ink);
}

.sticker-3d.is-selected {
  background: linear-gradient(180deg, #FFF6CE 0%, #FFDF7D 100%);
  animation: kawaiiJellySelect 0.48s var(--ease-bounce) forwards;
  box-shadow:
    0 8px 0 var(--ink),
    0 0 0 5px rgba(255, 123, 156, 0.5);
}

.sticker-3d.is-selected .sticker-emoji {
  animation: kawaiiWiggle 0.6s var(--ease-bounce);
}

.sticker-3d.is-selected::after {
  content: '✓';
  position: absolute;
  top: -9px;
  right: -9px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--mint);
  border: 2.5px solid var(--ink);
  color: var(--ink);
  font-weight: 900;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 0 var(--ink);
  animation: sparkleSpin 0.35s var(--ease-bounce) forwards;
}

/* Chip gợi ý 3D */
.chip-3d {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  border: 2.5px solid var(--ink);
  background: #FFFFFF;
  font-size: 0.82rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 3px 0 var(--ink);
  transition: transform 0.18s var(--ease-bounce), background-color 0.18s ease, box-shadow 0.18s var(--ease-bounce);
}

.chip-3d:hover {
  transform: translateY(-2px);
  background: var(--bg-sky-soft);
  box-shadow: 0 5px 0 var(--ink);
}

.chip-3d:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--ink);
}

.chip-3d.is-selected {
  background: var(--sun);
  animation: kawaiiJellySelect 0.4s var(--ease-bounce) forwards;
  box-shadow: 0 4px 0 var(--ink), 0 0 0 3px rgba(255, 202, 66, 0.45);
}

/* ==========================================================================
   THẺ CARD 3D & HEADER HERO
   ========================================================================== */

.card-3d {
  background: var(--bg-paper);
  border: var(--border-w) solid var(--ink);
  border-radius: var(--radius-xl);
  box-shadow: 0 7px 0 var(--ink);
  padding: 20px;
  position: relative;
  animation: cardPopIn 0.35s var(--ease-snappy);
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.brand-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #FFFFFF;
  border: var(--border-w) solid var(--ink);
  border-radius: var(--radius-pill);
  padding: 7px 18px 7px 10px;
  box-shadow: 0 5px 0 var(--ink);
}

.brand-icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(180deg, #FFE17D, #FFB830);
  border: 2.5px solid var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.35rem;
  box-shadow: inset 0 3px 0 rgba(255,255,255,0.65);
}

.brand-title {
  font-size: 1.2rem;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.01em;
}

.brand-sub {
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--ink-soft);
}

.topbar-stats {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}

.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  border: 2.5px solid var(--ink);
  background: #FFFFFF;
  font-weight: 900;
  font-size: 0.95rem;
  box-shadow: 0 4px 0 var(--ink);
}

.stat-pill.stars {
  background: linear-gradient(180deg, #FFF1B8, #FFD154);
}

.stat-pill.streak {
  background: linear-gradient(180deg, #FFE3D1, #FFB385);
}

.sync-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--mint-dark);
  display: inline-block;
  box-shadow: 0 0 0 3px rgba(82, 224, 160, 0.35);
}

.sync-dot.offline {
  background: var(--apricot);
  box-shadow: 0 0 0 3px rgba(255, 159, 89, 0.3);
}

/* ---------- Hero Banner Cha & Con + Hộp Đồ Chơi Vật Lý Cannon 3D ---------- */
.hero-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 16px;
  margin-bottom: 18px;
}

.hero-welcome {
  background: linear-gradient(155deg, #FFFDF7 0%, #FFF2D9 58%, #FFE7EE 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 14px;
  overflow: hidden;
}

.hero-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.hero-greeting h1 {
  margin: 0 0 6px;
  font-size: 1.55rem;
  font-weight: 900;
  line-height: 1.2;
}

.hero-date-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  background: #FFFFFF;
  border: 2px solid var(--ink);
  font-size: 0.8rem;
  font-weight: 800;
  margin-bottom: 8px;
  box-shadow: 0 3px 0 var(--ink);
}

.hero-mascots {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}

/* Lời nhắn ghim từ Cha */
.dad-note-bubble {
  position: relative;
  background: #FFFFFF;
  border: 2.5px solid var(--ink);
  border-radius: 18px;
  padding: 11px 14px;
  box-shadow: 0 4px 0 var(--ink);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.dad-note-heart {
  font-size: 1.35rem;
  animation: heartBeat 2.2s ease-in-out infinite;
  flex-shrink: 0;
}

.dad-note-text {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.4;
}

.dad-note-meta {
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--coral-dark);
  margin-bottom: 2px;
}

/* Thanh tiến độ sao hướng tới Vòng Quay */
.wheel-progress-box {
  background: rgba(255, 255, 255, 0.85);
  border: 2.5px solid var(--ink);
  border-radius: 16px;
  padding: 10px 14px;
}

.wheel-progress-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.84rem;
  font-weight: 800;
  margin-bottom: 6px;
  gap: 8px;
}

.progress-track-3d {
  height: 16px;
  border-radius: var(--radius-pill);
  border: 2.5px solid var(--ink);
  background: #F3E8DA;
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 2px 4px rgba(59, 38, 29, 0.14);
}

.progress-fill-3d {
  height: 100%;
  border-radius: var(--radius-pill);
  background: linear-gradient(90deg, #FFCA42, #FF8FAB, #52E0A0);
  transition: width 0.55s var(--ease-bounce);
  position: relative;
}

.progress-fill-3d::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 6px;
  right: 6px;
  height: 4px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.6);
}

/* ==========================================================================
   SÂN CHƠI VẬT LÝ CANNON 3D (CSS3D + GROUND CANVAS)
   ========================================================================== */

.physics-stage-card {
  padding: 14px;
  background: linear-gradient(180deg, #E8F7FF 0%, #FFF9EB 62%, #FFEFD6 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  min-height: 245px;
}

.physics-stage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  position: relative;
  z-index: 5;
}

.physics-stage-title {
  font-size: 0.84rem;
  font-weight: 900;
  background: rgba(255, 255, 255, 0.92);
  border: 2px solid var(--ink);
  border-radius: var(--radius-pill);
  padding: 3px 11px;
  box-shadow: 0 3px 0 var(--ink);
}

.physics-viewport {
  position: relative;
  width: 100%;
  height: 168px;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
}

.physics-viewport.dice-arena {
  height: 235px;
  border: var(--border-w) solid var(--ink);
  border-radius: 22px;
  background: linear-gradient(180deg, #E4F5FF 0%, #F7FCFF 48%, #FFF4DC 100%);
  box-shadow: inset 0 4px 12px rgba(59, 38, 29, 0.08), 0 6px 0 var(--ink);
}

.ground-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
}

.css3d-scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  perspective: 680px;
  perspective-origin: 50% 34%;
  overflow: hidden;
  z-index: 2;
  pointer-events: none;
}

.css3d-world {
  position: absolute;
  left: 50%;
  top: 66%;
  width: 0;
  height: 0;
  transform-style: preserve-3d;
}

.css3d-cube {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--cube-size, 44px);
  height: var(--cube-size, 44px);
  margin-left: calc(var(--cube-size, 44px) * -0.5);
  margin-top: calc(var(--cube-size, 44px) * -0.5);
  transform-style: preserve-3d;
  pointer-events: auto;
  cursor: grab;
  will-change: transform;
}

.css3d-face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2.5px solid var(--ink);
  border-radius: 9px;
  font-weight: 900;
  font-size: calc(var(--cube-size, 44px) * 0.46);
  color: var(--ink);
  backface-visibility: hidden;
  user-select: none;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.55), inset 0 -3px 0 rgba(0, 0, 0, 0.1);
}

.css3d-face.dice-face {
  background: #FFFDF9;
  border-radius: 11px;
  border-width: 3px;
  font-size: calc(var(--cube-size, 56px) * 0.48);
}

.physics-stage-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  position: relative;
  z-index: 5;
}

.physics-hint {
  font-size: 0.74rem;
  font-weight: 800;
  color: var(--ink-soft);
}

/* ==========================================================================
   THANH ĐIỀU HƯỚNG TAB 3D CHÍNH
   ========================================================================== */

.nav-tabs-3d {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.tab-3d {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 12px;
  border-radius: 20px;
  border: var(--border-w) solid var(--ink);
  background: #FFFFFF;
  font-weight: 900;
  font-size: 0.95rem;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--ink);
  transition: transform 0.18s var(--ease-bounce), box-shadow 0.18s var(--ease-bounce), background-color 0.18s ease;
}

.tab-3d:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 0 var(--ink);
  background: #FFFCF4;
}

.tab-3d:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 var(--ink);
}

.tab-3d.is-active {
  background: var(--sun);
  animation: kawaiiJellySelect 0.45s var(--ease-bounce) forwards;
  box-shadow:
    0 8px 0 var(--ink),
    inset 0 3px 0 rgba(255, 255, 255, 0.7),
    inset 0 -4px 0 rgba(214, 144, 18, 0.35);
}

.tab-3d.is-active.tab-games { background: var(--sky); }
.tab-3d.is-active.tab-wheel { background: var(--coral); }
.tab-3d.is-active.tab-memories { background: var(--mint); }

.tab-badge {
  position: absolute;
  top: -8px;
  right: -6px;
  min-width: 24px;
  height: 24px;
  padding: 0 6px;
  border-radius: var(--radius-pill);
  background: var(--berry);
  color: #FFFFFF;
  border: 2.5px solid var(--ink);
  font-size: 0.74rem;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 0 var(--ink);
}

/* ==========================================================================
   LỊCH TUẦN 3D (THỨ 2 -> CHỦ NHẬT KÈM NGÀY/THÁNG/NĂM)
   ========================================================================== */

.calendar-bar {
  margin-bottom: 18px;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.calendar-week-label {
  font-size: 1.05rem;
  font-weight: 900;
  display: flex;
  align-items: center;
  gap: 8px;
}

.week-strip {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 9px;
}

.day-pill-3d {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 10px 6px;
  border-radius: 18px;
  border: 2.5px solid var(--ink);
  background: #FFFFFF;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--ink);
  transition: transform 0.18s var(--ease-bounce), box-shadow 0.18s var(--ease-bounce), background-color 0.18s ease;
}

.day-pill-3d:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 0 var(--ink);
  background: var(--bg-sunny-soft);
}

.day-pill-3d:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 var(--ink);
}

.day-pill-3d.is-selected {
  background: linear-gradient(180deg, #FFE27A 0%, #FFC233 100%);
  border-width: 3px;
  animation: kawaiiJellySelect 0.45s var(--ease-bounce) forwards;
  box-shadow:
    0 7px 0 var(--ink),
    0 0 0 4px rgba(255, 202, 66, 0.42);
}

.day-pill-3d.is-complete:not(.is-selected) {
  background: var(--bg-mint-soft);
}

.day-pill-dow {
  font-size: 0.82rem;
  font-weight: 900;
}

.day-pill-date {
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--ink-soft);
}

.day-pill-3d.is-selected .day-pill-date {
  color: var(--ink);
}

.day-pill-dots {
  display: flex;
  gap: 4px;
  margin-top: 3px;
}

.day-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
  background: #F1E6D8;
}

.day-dot.done {
  background: var(--mint);
}

.day-dot.verified {
  background: var(--coral);
}

.today-ribbon {
  position: absolute;
  top: -9px;
  padding: 1px 7px;
  border-radius: var(--radius-pill);
  background: var(--coral);
  border: 2px solid var(--ink);
  font-size: 0.62rem;
  font-weight: 900;
  color: #3B1822;
  white-space: nowrap;
}

/* ==========================================================================
   DANH SÁCH NHIỆM VỤ TRONG NGÀY
   ========================================================================== */

.day-summary-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.day-summary-title {
  margin: 0;
  font-size: 1.28rem;
  font-weight: 900;
}

.day-summary-sub {
  margin: 2px 0 0;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--ink-soft);
}

.task-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.task-card-3d {
  background: #FFFFFF;
  border: var(--border-w) solid var(--ink);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  box-shadow: 0 6px 0 var(--ink);
  transition: transform 0.2s var(--ease-bounce), background-color 0.2s ease;
}

.task-card-3d.is-done {
  background: linear-gradient(135deg, #F4FFF9 0%, #FFFDF7 100%);
}

.task-card-3d.is-open {
  background: #FFFDF6;
  box-shadow: 0 8px 0 var(--ink), 0 0 0 4px rgba(99, 199, 255, 0.35);
}

.task-main-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.task-left {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  flex: 1;
}

.task-icon-box {
  width: 54px;
  height: 54px;
  border-radius: 17px;
  border: 2.5px solid var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.65rem;
  flex-shrink: 0;
  box-shadow: 0 4px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,0.65);
}

.task-icon-box.type-icon  { background: #FFE2EB; }
.task-icon-box.type-voice { background: #FFE5D4; }
.task-icon-box.type-call  { background: #DFF4FF; }
.task-icon-box.type-note  { background: #FFF2C6; }
.task-icon-box.type-quiz  { background: #EFE5FF; }
.task-icon-box.type-habit { background: #DDFBEA; }

.task-info {
  min-width: 0;
  flex: 1;
}

.task-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.task-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--sun);
  border: 2px solid var(--ink);
  font-size: 0.76rem;
  font-weight: 900;
  flex-shrink: 0;
}

.task-title {
  font-size: 1.04rem;
  font-weight: 900;
  margin: 0;
}

.task-desc {
  margin: 3px 0 0;
  font-size: 0.86rem;
  font-weight: 700;
  color: var(--ink-soft);
}

.task-points-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: var(--bg-sunny-soft);
  border: 2px solid var(--ink);
  font-size: 0.78rem;
  font-weight: 900;
}

/* Khu vực mở rộng làm nhiệm vụ */
.task-workspace {
  margin-top: 15px;
  padding-top: 15px;
  border-top: 2.5px dashed var(--cream-edge);
  animation: cardPopIn 0.28s var(--ease-bounce);
}

/* Kết quả nhiệm vụ đã gửi & Phản hồi từ Cha */
.task-submission-preview {
  margin-top: 12px;
  padding: 11px 14px;
  border-radius: 15px;
  background: #FFFFFF;
  border: 2px solid var(--cream-edge-dark);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 0.9rem;
  font-weight: 700;
}

.dad-reaction-pill {
  margin-top: 8px;
  padding: 8px 13px;
  border-radius: 14px;
  background: linear-gradient(90deg, #FFF0F5, #FFF6DB);
  border: 2px solid var(--ink);
  font-size: 0.85rem;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  box-shadow: 0 3px 0 var(--ink);
}

/* Máy ghi âm Kawaii */
.recorder-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border-radius: 20px;
  background: var(--bg-peach-soft);
  border: 2.5px solid var(--ink);
}

.waveform-canvas {
  width: 100%;
  max-width: 420px;
  height: 64px;
  border-radius: 14px;
  background: #FFFFFF;
  border: 2.5px solid var(--ink);
  display: block;
}

.audio-player-kawaii {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-sky-soft);
  border: 2.5px solid var(--ink);
  border-radius: var(--radius-pill);
  padding: 6px 14px 6px 8px;
  box-shadow: 0 3px 0 var(--ink);
}

/* Bảng cửu chương ôn nhanh */
.mult-table-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 8px;
  margin: 10px 0 14px;
}

.mult-cell {
  padding: 7px 10px;
  border-radius: 12px;
  background: #FFFFFF;
  border: 2px solid var(--ink);
  font-weight: 900;
  font-size: 0.9rem;
  text-align: center;
  box-shadow: 0 3px 0 var(--cream-edge-dark);
}

/* ==========================================================================
   MINI GAMES (XÚC XẮC 3D CANNON, HỨNG SAO CANVAS HD, LẬT THẺ 3D)
   ========================================================================== */

.game-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.answer-grid-3d {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 14px;
}

.answer-btn-3d {
  font-size: 1.35rem;
  font-weight: 900;
  padding: 15px 10px;
  border-radius: 18px;
}

.answer-btn-3d.is-wrong {
  background: var(--berry) !important;
  color: #FFF !important;
  animation: shakeNo 0.4s ease;
}

.answer-btn-3d.is-right {
  background: var(--mint) !important;
  animation: kawaiiJellySelect 0.45s var(--ease-bounce);
}

.catcher-canvas-wrap {
  position: relative;
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  border-radius: 24px;
  border: var(--border-w) solid var(--ink);
  overflow: hidden;
  box-shadow: 0 7px 0 var(--ink);
  background: #E6F6FF;
  touch-action: none;
}

.catcher-canvas {
  display: block;
  width: 100%;
  height: 360px;
  cursor: pointer;
}

/* Game lật thẻ CSS3D */
.memory-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  max-width: 540px;
  margin: 14px auto 0;
  perspective: 900px;
}

.memory-card {
  aspect-ratio: 1 / 1;
  position: relative;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.48s var(--ease-bounce);
}

.memory-card.is-flipped,
.memory-card.is-matched {
  transform: rotateY(180deg);
}

.memory-face {
  position: absolute;
  inset: 0;
  border-radius: 18px;
  border: var(--border-w) solid var(--ink);
  backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 5px 0 var(--ink);
  user-select: none;
}

.memory-front {
  background: linear-gradient(145deg, #FFE07D, #FFB838);
  font-size: 1.9rem;
  font-weight: 900;
}

.memory-back {
  background: #FFFFFF;
  transform: rotateY(180deg);
  font-size: 2.2rem;
}

.memory-card.is-matched .memory-back {
  background: linear-gradient(145deg, #D9FBE8, #9EF2C6);
}

/* ==========================================================================
   VÒNG QUAY PHẦN THƯỞNG (HIGH-DPI CANVAS)
   ========================================================================== */

.wheel-layout {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 18px;
  align-items: start;
}

.wheel-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  background: linear-gradient(180deg, #FFFDF7 0%, #FFEFEF 100%);
}

.wheel-canvas-box {
  position: relative;
  width: min(100%, 400px);
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.wheel-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.prize-bag-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 410px;
  overflow-y: auto;
  padding-right: 4px;
}

.prize-item-3d {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 14px;
  border-radius: 16px;
  border: 2.5px solid var(--ink);
  background: #FFFFFF;
  box-shadow: 0 4px 0 var(--ink);
}

.status-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--ink);
  font-size: 0.75rem;
  font-weight: 900;
  white-space: nowrap;
}

.status-tag.pending { background: var(--bg-sunny-soft); }
.status-tag.done    { background: var(--mint-light); }
.status-tag.love    { background: var(--coral-light); }

/* ==========================================================================
   MODAL 3D & BÀN PHÍM PIN ADMIN & TRANG QUẢN TRỊ CỦA CHA
   ========================================================================== */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(59, 38, 29, 0.52);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 900;
  animation: cardPopIn 0.2s ease;
}

.modal-3d {
  width: 100%;
  max-width: 440px;
  background: var(--bg-paper);
  border: 3.5px solid var(--ink);
  border-radius: 28px;
  box-shadow: 0 10px 0 var(--ink);
  padding: 24px;
  text-align: center;
  animation: kawaiiJellySelect 0.42s var(--ease-bounce);
}

.pin-dots {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 14px 0 18px;
}

.pin-dot {
  width: 46px;
  height: 52px;
  border-radius: 14px;
  border: var(--border-w) solid var(--ink);
  background: #FFFFFF;
  box-shadow: 0 4px 0 var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: 900;
  transition: transform 0.18s var(--ease-bounce), background-color 0.18s ease;
}

.pin-dot.filled {
  background: var(--sun);
  transform: translateY(-3px) scale(1.05);
}

.pin-dots.is-error {
  animation: shakeNo 0.4s ease;
}

.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 280px;
  margin: 0 auto;
}

.pin-key {
  font-size: 1.25rem;
  font-weight: 900;
  padding: 12px;
  border-radius: 16px;
}

/* Trang Admin của Cha */
.admin-banner {
  background: linear-gradient(135deg, #E8F6FF 0%, #FFF7E0 100%);
  margin-bottom: 16px;
}

.admin-kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.kpi-card {
  background: #FFFFFF;
  border: 2.5px solid var(--ink);
  border-radius: 18px;
  padding: 13px 14px;
  box-shadow: 0 5px 0 var(--ink);
}

.kpi-value {
  font-size: 1.55rem;
  font-weight: 900;
  line-height: 1.15;
}

.kpi-label {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--ink-soft);
}

.admin-subtabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.admin-form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.link-copy-row {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* Toast thông báo nổi Kawaii */
.toast-kawaii {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: #FFFFFF;
  border: var(--border-w) solid var(--ink);
  border-radius: var(--radius-pill);
  padding: 10px 22px;
  font-weight: 900;
  font-size: 0.95rem;
  box-shadow: 0 6px 0 var(--ink);
  z-index: 950;
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: calc(100vw - 32px);
  text-align: center;
}

/* Footer nhỏ cho link của bé */
.app-footer {
  margin-top: 26px;
  text-align: center;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

  }
  .memory-grid {
    grid-template-columns: repeat(3, 1fr);
  }

    flex-direction: column;
    align-items: stretch;
  }
  .admin-form-grid {
    grid-template-columns: 1fr;
  }
  .link-copy-row {
    flex-direction: column;
    align-items: stretch;
  }
  .hero-greeting h1 {
    font-size: 1.3rem;
  }
}

  const KawaiiSFX = {
    ctx: null,
    muted: false,

    ensure() {
      if (this.muted) return null;
      if (!this.ctx) {
        const AC = global.AudioContext || global.webkitAudioContext;
        if (!AC) return null;
        try {
          this.ctx = new AC();
        } catch (_) {
          return null;
        }
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      return this.ctx;
    },

    tone(freq, dur, type = 'sine', vol = 0.14, delay = 0, slideTo = null) {
      const ctx = this.ensure();
      if (!ctx) return;
      try {
        const now = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), now + dur);
        }
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      } catch (_) {}
    },

    playPop() {
      this.tone(460, 0.085, 'sine', 0.12, 0, 720);
    },

    playSelect() {
      this.tone(523.25, 0.09, 'triangle', 0.13, 0, 659.25);
      this.tone(783.99, 0.12, 'sine', 0.11, 0.055);
    },

    playBounce(impact = 3) {
      const clamped = Math.min(1, Math.max(0.12, impact / 12));
      const base = 170 + clamped * 150 + Math.random() * 45;
      this.tone(base, 0.09, 'triangle', 0.09 * clamped, 0, base * 0.62);
    },

    playTick(speedRatio = 0.5) {
      const f = 680 + Math.min(1, speedRatio) * 380;
      this.tone(f, 0.042, 'triangle', 0.11, 0, f * 0.55);
    },

    playSuccess() {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((n, i) => this.tone(n, 0.22, 'triangle', 0.14, i * 0.075));
    },

    playHeart() {
      this.tone(587.33, 0.14, 'sine', 0.13, 0);
      this.tone(880, 0.24, 'sine', 0.13, 0.08, 987.77);
    },

    playOops() {
      this.tone(330, 0.15, 'sawtooth', 0.07, 0, 240);
      this.tone(240, 0.2, 'triangle', 0.09, 0.11, 185);
    },

    playFanfare() {
      const seq = [
        [523.25, 0, 0.14],
        [659.25, 0.1, 0.14],
        [783.99, 0.2, 0.14],
        [1046.5, 0.32, 0.38],
        [783.99, 0.48, 0.14],
        [1046.5, 0.6, 0.48],

      seq.forEach(([f, d, dur]) => this.tone(f, dur, 'triangle', 0.15, d));
    },

      const melody = [523.25, 587.33, 659.25, 783.99, 659.25, 1046.5];

  class HiDPICanvas {
    constructor(canvas, onResize) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.width = 0;
      this.height = 0;
      this.dpr = 1;
      this.onResize = onResize || null;
      this._ro = null;
      this._winHandler = () => this.resize();
      this.resize();

      if (typeof ResizeObserver !== 'undefined') {
        this._ro = new ResizeObserver(() => this.resize());
        this._ro.observe(canvas);
      } else {
        global.addEventListener('resize', this._winHandler);
      }
    }

    resize() {
      if (!this.canvas) return;
      const rect = this.canvas.getBoundingClientRect();
      const w = Math.max(1, Math.round(rect.width || this.canvas.clientWidth || 300));
      const h = Math.max(1, Math.round(rect.height || this.canvas.clientHeight || 150));
      const dpr = Math.min(global.devicePixelRatio || 1, 3);
      if (w === this.width && h === this.height && dpr === this.dpr) return;
      this.width = w;
      this.height = h;
      this.dpr = dpr;
      this.canvas.width = Math.round(w * dpr);
      this.canvas.height = Math.round(h * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.ctx.imageSmoothingEnabled = true;
      this.ctx.imageSmoothingQuality = 'high';
      if (this.onResize) this.onResize(w, h, dpr);
    }

    clear() {
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this.ctx.clearRect(0, 0, this.width, this.height);
    }

      if (this._ro) this._ro.disconnect();
      global.removeEventListener('resize', this._winHandler);

    /* Các hàm vẽ hình học Kawaii sắc nét */
    static drawStar(ctx, cx, cy, spikes, outerR, innerR) {
      let rot = -Math.PI / 2;
      const step = Math.PI / spikes;
      ctx.beginPath();
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
        rot += step;
        ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
        rot += step;
      }
      ctx.closePath();
    }

    static drawHeart(ctx, x, y, size) {
      const s = size * 0.5;
      ctx.beginPath();
      ctx.moveTo(x, y + s * 0.65);

      ctx.bezierCurveTo(x + s * 1.15, y - s * 1.05, x + s * 1.25, y - s * 0.1, x, y + s * 0.65);
      ctx.closePath();
    }

      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

      ctx.arc(-18, 4, 13, Math.PI * 0.5, Math.PI * 1.5);
      ctx.arc(-6, -7, 15, Math.PI * 1.05, Math.PI * 1.9);
      ctx.arc(12, -4, 13, Math.PI * 1.15, Math.PI * 1.95);
      ctx.arc(20, 5, 11, Math.PI * 1.5, Math.PI * 0.5);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 2.6;
        ctx.stroke();

    constructor() {

      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const spd = 110 + Math.random() * 210;
        this.particles.push({
          kind: 'star',
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 90,
          g: 390,
          size: 7 + Math.random() * 7,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 8,
          color: KAWAII_PALETTE[i % KAWAII_PALETTE.length],

          decay: 0.95 + Math.random() * 0.45,

      }
      this.shockwave(x, y, '#FFCA42');
      this._wake();
    }

      if (!this.hi) return;
      const heartColors = ['#FF7B9C', '#FF5D73', '#FFB3C6', '#FFCA42'];
      for (let i = 0; i < count; i++) {
        const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.9;
        const spd = 85 + Math.random() * 170;

          kind: 'heart',
          x: x + (Math.random() - 0.5) * 28,
